# The whole server: the app, its database, and Caddy for HTTPS.
# Values marked ${...} come from the .env file next to this one (see .env.example).

services:
  app:
    build: .
    restart: unless-stopped
    # Every TANIOS_ setting in .env reaches the app. The two below are fixed here.
    env_file: .env
    environment:
      TANIOS_ENV: production
      TANIOS_DATABASE_URL: postgresql+asyncpg://tanios:${POSTGRES_PASSWORD}@db:5432/tanios
      TANIOS_VAULTS_DIR: /vaults
    volumes:
      # The models file. Edits here apply after: docker compose restart app
      - ./config:/app/config:ro
      # Tanios's notes: one Obsidian vault per user (see docs/MEMORY.md).
      - vault-data:/vaults
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tanios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tanios
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanios -d tanios"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TANIOS_DOMAIN: ${TANIOS_DOMAIN:?set TANIOS_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Keeps the owner's Tanios vault in step with Obsidian Sync. It only starts once it has
  # been set up, which docs/MEMORY.md walks through. It holds the Obsidian sign-in in its
  # own volume and is given none of the settings in .env.
  vault-sync:
    profiles: ["sync"]
    build: ./docker/vault-sync
    restart: unless-stopped
    volumes:
      - vault-data:/vaults
      - vault-sync-state:/state
    command: ["ob", "sync", "--path", "/vaults/user-1", "--continuous"]

volumes:
  db-data:
  vault-data:
  vault-sync-state:
  caddy-data:
  caddy-config:
