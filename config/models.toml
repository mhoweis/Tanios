# Which models Tanios uses, and for what.
#
# To change anything, do not edit this file. Copy it to models.local.toml in this
# folder and edit the copy: Tanios reads the copy when it exists, and updates to
# Tanios will not overwrite it. Then restart: docker compose restart app
#
# Checked against openrouter.ai on 15 November 2026. Model IDs and prices change;
# browse https://openrouter.ai/models for current ones.

# --- Providers: where models are reached ----------------------------------------------
#
# Any service that speaks the OpenAI chat-completions format works. The key for a
# provider named "example" is read from the setting TANIOS_KEYS__EXAMPLE in .env.
# OpenRouter's key can also be given as TANIOS_OPENROUTER_API_KEY.

[providers.openrouter]
api_base = "https://openrouter.ai/api/v1"

# [providers.deepseek]
# api_base = "https://api.deepseek.com/v1"

# --- Tiers: cheapest first ------------------------------------------------------------
#
# For each task Tanios takes the first model in the task's tier whose provider has a
# key. If an answer fails its check, it retries once on the next tier up.
#
# The prices are per million tokens in US dollars. They are only used when a provider
# does not report what a call cost; OpenRouter does report it.
#
# free = true marks a model that costs nothing. Free models never see private content
# (email, notes, files) unless you set TANIOS_ALLOW_FREE_FOR_PRIVATE=true.

[[tiers.free]]
provider = "openrouter"
model = "openrouter/free"
free = true

[[tiers.small]]
provider = "openrouter"
model = "~anthropic/claude-haiku-latest"
input_price = 0.10
output_price = 0.50

[[tiers.small]]
provider = "openrouter"
model = "google/gemini-3.1-flash-lite"
input_price = 0.125
output_price = 0.75

[[tiers.medium]]
provider = "openrouter"
model = "~anthropic/claude-sonnet-latest"
input_price = 2.00
output_price = 10.00

[[tiers.top]]
provider = "openrouter"
model = "~anthropic/claude-opus-latest"
input_price = 4.00
output_price = 20.00

# --- Speech: voice notes in, voice notes out -------------------------------------------
#
# transcribe turns your voice note into text. speak turns the answer into a voice.
# As with tiers, the first entry whose provider has a key is used.
#
# To change Tanios's voice, change the voice line. The voices a model offers are listed
# on its page at openrouter.ai.
#
# The transcribe price was read from openrouter.ai on 15 November 2026 ($0.000003 a
# second). The speak price is an estimate, not a published figure: check the Activity
# page on openrouter.ai to see what voice replies really cost.

[[speech.transcribe]]
provider = "openrouter"
model = "openai/whisper-large-v3-turbo"
language = "en"
price_per_minute = 0.00018

[[speech.speak]]
provider = "openrouter"
model = "openai/gpt-4o-mini-tts-2025-12-15"
voice = "alloy"
format = "mp3"
price_per_million_chars = 15.00

# --- Tasks: which tier each kind of work starts on ------------------------------------

[tasks]
chat = "small"
# Sorting new email into labels, several emails in one call.
label = "small"
# Writing a reply to an email.
draft = "medium"
