name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tanios
          POSTGRES_PASSWORD: tanios
          POSTGRES_DB: tanios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tanios -d tanios"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TANIOS_TEST_DATABASE_URL: postgresql+asyncpg://tanios:tanios@127.0.0.1:5432/tanios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tanios .
      - name: The image starts and answers its health check
        run: |
          docker run -d --name tanios -p 8000:8000 tanios
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs tanios
          exit 1
