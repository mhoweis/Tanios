name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tanios
          POSTGRES_PASSWORD: tanios
          POSTGRES_DB: tanios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tanios -d tanios"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TANIOS_TEST_DATABASE_URL: postgresql+asyncpg://tanios:tanios@127.0.0.1:5432/tanios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg (the voice-note tests convert real audio)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tanios .
      - name: The image starts and answers its health check
        run: |
          docker run -d --name tanios -p 8000:8000 tanios
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs tanios
          exit 1
      - name: The image can encode WhatsApp voice notes
        run: docker run --rm tanios sh -c "ffmpeg -hide_banner -encoders | grep libopus"
      - name: The vault-sync image builds and Obsidian Headless runs
        run: |
          docker build -t tanios-vault-sync docker/vault-sync
          docker run --rm tanios-vault-sync ob --version
          docker run --rm tanios-vault-sync ob sync --help
      - name: The app and vault-sync can both write the same vault folder
        run: |
          docker volume create vault-check
          docker run --rm -v vault-check:/vaults tanios sh -c "mkdir /vaults/user-1 && echo from-app > /vaults/user-1/note.md"
          docker run --rm -v vault-check:/vaults tanios-vault-sync sh -c "echo from-sync >> /vaults/user-1/note.md"
          docker run --rm -v vault-check:/vaults tanios sh -c "echo from-app-again >> /vaults/user-1/note.md && cat /vaults/user-1/note.md" | tee /tmp/note.txt
          test "$(wc -l < /tmp/note.txt)" = "3"
      - name: The compose file is valid with and without vault sync
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/" .env
          docker compose config --quiet
          docker compose --profile sync config --quiet
